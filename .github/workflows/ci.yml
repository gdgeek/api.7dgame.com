name: CI

on:
  push:
    branches: ['**']  # 包括 feature/foo、codex/foo 等含斜杠的分支
  pull_request:
    branches: [develop, main, publish]

# Serialize mutable branch/latest publishers. Remote-head checks fail stale
# runs, but they are not a registry CAS: Task 5.1 Stage A still requires an
# approved branch-freeze window and post-push digest/consumer convergence.
concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  # 阶段1: 测试
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii2_advanced_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, gd, zip, pcntl, posix

      - name: Configure CA Certificates For Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

          # Optional: install corporate/self-signed root CA from GitHub Secret (base64 encoded PEM/CRT).
          if [ -n "${{ secrets.CUSTOM_CA_CERT_B64 }}" ]; then
            echo "${{ secrets.CUSTOM_CA_CERT_B64 }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/custom-ca.crt > /dev/null
            sudo update-ca-certificates
          fi

          composer config -g cafile /etc/ssl/certs/ca-certificates.crt
          composer config -g secure-http true
          
      - name: Install Dependencies
        working-directory: ./advanced
        run: |
          composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare Test Configs
        working-directory: ./advanced
        run: |
          # Common Configs
          echo "<?php return ['vendorPath' => dirname(dirname(__DIR__)) . '/vendor'];" > common/config/main.php
          echo "<?php return [];" > common/config/params.php
          echo "<?php
          Yii::setAlias('@common', dirname(__DIR__));
          Yii::setAlias('@frontend', dirname(dirname(__DIR__)) . '/frontend');
          Yii::setAlias('@backend', dirname(dirname(__DIR__)) . '/backend');
          Yii::setAlias('@console', dirname(dirname(__DIR__)) . '/console');
          Yii::setAlias('@api', dirname(dirname(__DIR__)) . '/api');
          " > common/config/bootstrap.php
          
          echo "<?php return [
              'id' => 'app-common',
              'basePath' => dirname(__DIR__),
              'components' => [
                  'db' => [
                      'class' => 'yii\db\Connection',
                      'dsn' => 'mysql:host=127.0.0.1;dbname=yii2_advanced_test',
                      'username' => 'root',
                      'password' => 'root',
                      'charset' => 'utf8',
                  ],
              ],
          ];" > common/config/main-local.php
          echo "<?php return [];" > common/config/test.php
          echo "<?php return ['id' => 'app-common-tests', 'basePath' => dirname(__DIR__)];" > common/config/test-local.php
          
          # Console Configs (Needed for Migrations)
          echo "<?php return [];" > console/config/bootstrap.php
          echo "<?php return [];" > console/config/params.php
          echo "<?php return [
              'id' => 'app-console',
              'basePath' => dirname(__DIR__),
              'controllerNamespace' => 'console\controllers',
              'controllerMap' => [
                  'task51-migrate' => [
                      'class' => 'console\controllers\Task51MigrateController',
                      'db' => 'task51CoordinatorDb',
                      'migrationPath' => '@console/migrations',
                      'migrationTable' => '{{%migration}}',
                  ],
              ],
              'components' => [
                  'task51CoordinatorDb' => [
                      'class' => 'yii\db\Connection',
                      'commandClass' => 'yii\db\Command',
                      'dsn' => 'mysql:host=127.0.0.1;dbname=yii2_advanced_test',
                      'username' => 'root',
                      'password' => 'root',
                      'charset' => 'utf8mb4',
                      'enableSlaves' => false,
                      'attributes' => [\PDO::ATTR_TIMEOUT => 5],
                  ],
                  'log' => [
                      'targets' => [
                          [
                              'class' => 'yii\log\FileTarget',
                              'levels' => ['error', 'warning'],
                          ],
                      ],
                  ],
                  'authManager' => [
                      'class' => 'yii\rbac\DbManager',
                  ],
              ],
          ];" > console/config/main.php
          echo "<?php return [];" > console/config/main-local.php
          
          # Common Codeception Config (Merges all)
          echo "<?php
          return yii\helpers\ArrayHelper::merge(
              require __DIR__ . '/main.php',
              require __DIR__ . '/main-local.php',
              require __DIR__ . '/test.php',
              require __DIR__ . '/test-local.php',
              [
                  'components' => [
                      'cache' => [
                          'class' => 'yii\caching\ArrayCache',
                      ],
                      'request' => [
                          'cookieValidationKey' => 'test-key-common',
                      ],
                      'user' => [
                          'class' => 'yii\web\User',
                          'identityClass' => 'api\modules\v1\models\User',
                      ],
                      'jwt' => [
                           'class' => 'bizley\jwt\Jwt', 
                           'signer' => 'HS256', 
                           'signingKey' => 'secure-signing-key-should-be-at-least-256-bits-long-for-hs256', 
                      ],
                  ],
              ]
          );" > common/config/codeception-local.php

          # Backend Configs
          echo "<?php return [];" > backend/config/main.php
          echo "<?php return ['id' => 'app-backend', 'basePath' => dirname(__DIR__)];" > backend/config/main-local.php
          echo "<?php return [];" > backend/config/test.php
          echo "<?php return ['id' => 'app-backend-tests', 'basePath' => dirname(__DIR__)];" > backend/config/test-local.php
          
          # Backend Codeception Config
          echo "<?php
          return yii\helpers\ArrayHelper::merge(
              require dirname(dirname(__DIR__)) . '/common/config/codeception-local.php',
              require __DIR__ . '/main.php',
              require __DIR__ . '/main-local.php',
              require __DIR__ . '/test.php',
              require __DIR__ . '/test-local.php',
              [
                  'components' => [
                      'request' => [
                          'cookieValidationKey' => 'test-key-backend',
                      ],
                  ],
              ]
          );" > backend/config/codeception-local.php

          # API Configs
          echo "<?php return [];" > api/config/main.php
          echo "<?php return ['id' => 'app-api', 'basePath' => dirname(__DIR__)];" > api/config/main-local.php
          
          # API Test Local (functions as Codeception Config for API)
          echo "<?php
          return yii\helpers\ArrayHelper::merge(
               require dirname(dirname(__DIR__)) . '/common/config/codeception-local.php',
              require __DIR__ . '/main.php',
              require __DIR__ . '/main-local.php',
              [
                  'id' => 'app-api-tests',
                  'basePath' => dirname(__DIR__),
                  'components' => [
                      'request' => [
                          'cookieValidationKey' => 'test-key-api',
                      ],
                  ],
              ]
          );" > api/config/test-local.php

      - name: Run Migrations
        working-directory: ./advanced
        run: |
          # Try to import initial SQL if exists
          if [ -f "../docker/bujiaban.sql" ]; then
            echo "Importing initial SQL dump..."
            mysql -h 127.0.0.1 -u root -proot yii2_advanced_test < ../docker/bujiaban.sql
          fi

          # Apply RBAC migrations explicitly first
          php yii migrate/up --migrationPath=@yii/rbac/migrations --interactive=0
          # Task 5.1 must use its exact-one command surface and standard,
          # non-retrying coordinator adapter before generic app migrations.
          task51_plan_output=$(php yii task51-migrate/plan --db=task51CoordinatorDb)
          test "$(grep -Fxc \
            'TASK51_MIGRATION_PLAN=EXACT_ONE:m260828_170000_create_task51_stage_b_coordinator_tables' \
            <<< "${task51_plan_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_PLAN=' <<< "${task51_plan_output}")" = 1
          task51_up_output=$(php yii task51-migrate/up 1 --db=task51CoordinatorDb --interactive=0)
          test "$(grep -Fxc \
            'TASK51_MIGRATION_APPLY=APPLIED_EXACT_ONE' \
            <<< "${task51_up_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_APPLY=' <<< "${task51_up_output}")" = 1
          test "$(grep -Ec \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${task51_up_output}")" = 1
          task51_schema_sha=$(grep -E \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${task51_up_output}" | cut -d= -f2)
          task51_applied_plan_output=$(php yii task51-migrate/plan --db=task51CoordinatorDb)
          test "$(grep -Fxc 'TASK51_MIGRATION_PLAN=ALREADY_APPLIED' \
            <<< "${task51_applied_plan_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_PLAN=' \
            <<< "${task51_applied_plan_output}")" = 1
          test "$(grep -Ec \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${task51_applied_plan_output}")" = 1
          test "$(grep -Fxc \
            "TASK51_MIGRATION_SCHEMA_SHA256=${task51_schema_sha}" \
            <<< "${task51_applied_plan_output}")" = 1
          migration_row_count=$(MYSQL_PWD=root mysql -h 127.0.0.1 -u root \
            --batch --skip-column-names yii2_advanced_test -e \
            "SELECT COUNT(*) FROM migration WHERE version = 'm260828_170000_create_task51_stage_b_coordinator_tables'")
          test "${migration_row_count}" = 1
          coordinator_table_count=$(MYSQL_PWD=root mysql -h 127.0.0.1 -u root \
            --batch --skip-column-names information_schema -e \
            "SELECT COUNT(*) FROM tables WHERE table_schema = 'yii2_advanced_test' AND table_name IN ('task51_stage_b_execution', 'task51_stage_b_transition')")
          test "${coordinator_table_count}" = 2
          # Apply App migrations
          php yii migrate --interactive=0

      - name: Run Unit Tests
        working-directory: ./advanced
        run: |
          echo "Running PHPUnit tests..."
          ls -la tests/unit/models/
          echo "Checking phpunit.xml..."
          ls -la phpunit.xml
          echo "Running tests..."
          php vendor/bin/phpunit -c phpunit.xml --testdox

      - name: Prepare Task 5.1 Isolated MySQL
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -u root -e \
            "CREATE DATABASE task51_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"

      - name: Run Task 5.1 MySQL Integration
        working-directory: ./advanced
        env:
          TASK51_MYSQL_INTEGRATION: '1'
          TASK51_MYSQL_TEST_DSN: mysql:host=127.0.0.1;dbname=task51_test_ci
          TASK51_MYSQL_TEST_USER: root
          TASK51_MYSQL_TEST_PASSWORD: root
        run: |
          php vendor/bin/phpunit -c phpunit.xml \
            tests/integration/Task51StageBMySqlCasTest.php \
            --testdox --fail-on-skipped

  # 阶段2: 构建 Docker 镜像（仅 publish / main / develop 分支）
  build:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/publish' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      )
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, gd

      - name: Configure CA Certificates For Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates default-mysql-client
          sudo update-ca-certificates

          # Optional: install corporate/self-signed root CA from GitHub Secret (base64 encoded PEM/CRT).
          if [ -n "${{ secrets.CUSTOM_CA_CERT_B64 }}" ]; then
            echo "${{ secrets.CUSTOM_CA_CERT_B64 }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/custom-ca.crt > /dev/null
            sudo update-ca-certificates
          fi

          composer config -g cafile /etc/ssl/certs/ca-certificates.crt
          composer config -g secure-http true

      - name: Install Dependencies (Production)
        working-directory: ./advanced
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader
      
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          password: ${{ secrets.TENCENT_DOCKER_PASSWORD }}
          
      - name: Write Git Commit Hash
        run: echo "${{ github.sha }}" > advanced/GIT_COMMIT

      - name: Write Build Time
        run: TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S' > advanced/BUILD_TIME

      - name: Build Docker Image
        run: |
          set -euo pipefail
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||' | sed 's|/|-|g')
          TASK51_RELEASE_IMAGE="hkccr.ccs.tencentyun.com/gdgeek/api:${BRANCH_NAME}"
          TASK51_RELEASE_IMMUTABLE_IMAGE="hkccr.ccs.tencentyun.com/gdgeek/api:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          remote_head=$(git ls-remote --exit-code origin "${GITHUB_REF}" | awk '{print $1}')
          test "${remote_head}" = "${{ github.sha }}"
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${TASK51_RELEASE_IMAGE}" \
            -t "${TASK51_RELEASE_IMMUTABLE_IMAGE}" \
            -f docker/Release \
            .
          echo "TASK51_RELEASE_IMAGE=${TASK51_RELEASE_IMAGE}" >> "${GITHUB_ENV}"
          echo "TASK51_RELEASE_IMMUTABLE_IMAGE=${TASK51_RELEASE_IMMUTABLE_IMAGE}" >> "${GITHUB_ENV}"

      - name: Smoke Task 5.1 Release Image
        shell: bash
        run: |
          set -euo pipefail

          expected_commit=$(tr -d '\r\n' < advanced/GIT_COMMIT)
          actual_commit=$(docker run --rm "${TASK51_RELEASE_IMAGE}" \
            sh -c "tr -d '\\r\\n' < /var/www/html/advanced/GIT_COMMIT")
          test "${actual_commit}" = "${expected_commit}"

          actual_oci_revision=$(docker image inspect \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${TASK51_RELEASE_IMAGE}")
          test "${actual_oci_revision}" = "${expected_commit}"

          expected_console_config_sha=$(sha256sum files/console/config/main.php | awk '{print $1}')
          actual_console_config_sha=$(docker run --rm "${TASK51_RELEASE_IMAGE}" \
            sha256sum /var/www/html/advanced/console/config/main.php | awk '{print $1}')
          test "${actual_console_config_sha}" = "${expected_console_config_sha}"

          # Exercise the real release overlay and console bootstrap against a
          # separate MySQL database. The test job above deliberately uses a
          # generated unit-test config; it cannot substitute for this image-
          # exact migration proof.
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root -e \
            "CREATE DATABASE task51_release_image_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root task51_release_image_ci -e \
            "CREATE TABLE migration (version varchar(180) NOT NULL PRIMARY KEY, apply_time integer) ENGINE=InnoDB; INSERT INTO migration (version, apply_time) VALUES ('m000000_000000_base', UNIX_TIMESTAMP())"
          release_mysql_args=(
            --rm
            --network host
            -e MYSQL_HOST=127.0.0.1
            -e MYSQL_DB=task51_release_image_ci
            -e MYSQL_USERNAME=root
            -e MYSQL_PASSWORD=root
          )
          release_plan_output=$(docker run "${release_mysql_args[@]}" \
            "${TASK51_RELEASE_IMAGE}" php ./yii task51-migrate/plan --db=task51CoordinatorDb)
          test "$(grep -Fxc \
            'TASK51_MIGRATION_PLAN=EXACT_ONE:m260828_170000_create_task51_stage_b_coordinator_tables' \
            <<< "${release_plan_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_PLAN=' <<< "${release_plan_output}")" = 1
          release_up_output=$(docker run "${release_mysql_args[@]}" \
            "${TASK51_RELEASE_IMAGE}" php ./yii task51-migrate/up 1 \
            --db=task51CoordinatorDb --interactive=0)
          test "$(grep -Fxc \
            'TASK51_MIGRATION_APPLY=APPLIED_EXACT_ONE' \
            <<< "${release_up_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_APPLY=' <<< "${release_up_output}")" = 1
          test "$(grep -Ec \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${release_up_output}")" = 1
          release_schema_sha=$(grep -E \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${release_up_output}" | cut -d= -f2)
          release_applied_plan_output=$(docker run "${release_mysql_args[@]}" \
            "${TASK51_RELEASE_IMAGE}" php ./yii task51-migrate/plan --db=task51CoordinatorDb)
          test "$(grep -Fxc 'TASK51_MIGRATION_PLAN=ALREADY_APPLIED' \
            <<< "${release_applied_plan_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_PLAN=' \
            <<< "${release_applied_plan_output}")" = 1
          test "$(grep -Ec \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${release_applied_plan_output}")" = 1
          test "$(grep -Fxc \
            "TASK51_MIGRATION_SCHEMA_SHA256=${release_schema_sha}" \
            <<< "${release_applied_plan_output}")" = 1
          release_migration_row_count=$(MYSQL_PWD=root mysql -h 127.0.0.1 -u root \
            --batch --skip-column-names task51_release_image_ci -e \
            "SELECT COUNT(*) FROM migration WHERE version = 'm260828_170000_create_task51_stage_b_coordinator_tables'")
          test "${release_migration_row_count}" = 1
          release_table_count=$(MYSQL_PWD=root mysql -h 127.0.0.1 -u root \
            --batch --skip-column-names information_schema -e \
            "SELECT COUNT(*) FROM tables WHERE table_schema = 'task51_release_image_ci' AND table_name IN ('task51_stage_b_execution', 'task51_stage_b_transition')")
          test "${release_table_count}" = 2
          release_noop_output=$(docker run "${release_mysql_args[@]}" \
            "${TASK51_RELEASE_IMAGE}" php ./yii task51-migrate/up 1 \
            --db=task51CoordinatorDb --interactive=0)
          test "$(grep -Fxc \
            'TASK51_MIGRATION_APPLY=ALREADY_APPLIED_NOOP' \
            <<< "${release_noop_output}")" = 1
          test "$(grep -c '^TASK51_MIGRATION_APPLY=' <<< "${release_noop_output}")" = 1
          test "$(grep -Ec \
            '^TASK51_MIGRATION_SCHEMA_SHA256=[0-9a-f]{64}$' \
            <<< "${release_noop_output}")" = 1
          test "$(grep -Fxc \
            "TASK51_MIGRATION_SCHEMA_SHA256=${release_schema_sha}" \
            <<< "${release_noop_output}")" = 1

          expected_entry_sha=$(sha256sum files/api/web/index.php | awk '{print $1}')
          actual_entry_sha=$(docker run --rm "${TASK51_RELEASE_IMAGE}" \
            sha256sum /var/www/html/advanced/api/web/index.php | awk '{print $1}')
          test "${actual_entry_sha}" = "${expected_entry_sha}"

          docker run --rm "${TASK51_RELEASE_IMAGE}" php -r '
            $expected = [
              "display_errors" => false,
              "display_startup_errors" => false,
              "zend.exception_ignore_args" => true,
              "log_errors" => true,
            ];
            foreach ($expected as $name => $required) {
              $actual = filter_var(
                ini_get($name),
                FILTER_VALIDATE_BOOLEAN,
                FILTER_NULL_ON_FAILURE
              );
              if ($actual !== $required) {
                fwrite(STDERR, "Unexpected release ini directive: {$name}\n");
                exit(1);
              }
            }
            $loaded = php_ini_loaded_file();
            $scanned = php_ini_scanned_files();
            if (!is_string($loaded) || basename($loaded) !== "php.ini"
                || !is_string($scanned)
                || !str_contains($scanned, "zz-task51-security.ini")) {
              fwrite(STDERR, "Release PHP configuration is not loaded exactly.\n");
              exit(1);
            }
          '

          task51_random_base64url() {
            openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\r\n'
          }
          task51_assert_container_files_clean() {
            local task51_container_id="$1"
            local task51_sentinel="$2"
            docker exec "${task51_container_id}" sh -c '
              needle="$1"
              for root in /var/www/html/advanced/api/runtime /var/log/apache2; do
                [ -d "${root}" ] || continue
                grep -rFq -- "${needle}" "${root}"
                scan_status=$?
                if [ "${scan_status}" -eq 0 ]; then
                  exit 42
                fi
                if [ "${scan_status}" -ne 1 ]; then
                  exit "${scan_status}"
                fi
              done
            ' task51-file-scan "${task51_sentinel}"
          }
          task51_wait_for_apache() {
            local task51_container_id="$1"
            local task51_host_port="$2"
            local task51_phase="$3"
            local task51_exit_code
            local task51_running
            local task51_readiness_status='000'

            for _ in $(seq 1 50); do
              if ! task51_running=$(docker inspect \
                --format='{{.State.Running}}' "${task51_container_id}"); then
                echo "Release ${task51_phase} container disappeared before readiness." >&2
                return 1
              fi
              if [ "${task51_running}" != true ]; then
                task51_exit_code=$(docker inspect \
                  --format='{{.State.ExitCode}}' "${task51_container_id}")
                echo "Release ${task51_phase} container exited before readiness (exit=${task51_exit_code})." >&2
                return 1
              fi
              if task51_readiness_status=$(curl --silent \
                --max-time 1 \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Host: api.xrteeth.com' \
                "http://127.0.0.1:${task51_host_port}/robots.txt") \
                && [ "${task51_readiness_status}" = '200' ]; then
                return 0
              fi
              sleep 0.1
            done

            echo "Release ${task51_phase} Apache readiness timed out (status=${task51_readiness_status})." >&2
            return 1
          }
          trace_sentinel=$(task51_random_base64url)
          test "${#trace_sentinel}" = 43
          trace_output=$(docker run --rm \
            -e TASK51_CI_TRACE_SENTINEL="${trace_sentinel}" \
            "${TASK51_RELEASE_IMAGE}" \
            php -d error_log=/dev/stderr -r '
              function task51CiTraceProbe(string $secret): void {
                throw new RuntimeException("TASK51_CI_EXPECTED_EXCEPTION");
              }
              task51CiTraceProbe((string)getenv("TASK51_CI_TRACE_SENTINEL"));
            ' 2>&1 || true)
          grep -Fq 'TASK51_CI_EXPECTED_EXCEPTION' <<< "${trace_output}"
          if grep -Fq -- "${trace_sentinel}" <<< "${trace_output}"; then
            echo 'Release PHP exception trace exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi

          docker run --rm "${TASK51_RELEASE_IMAGE}" apache2ctl -t
          vhost_dump=$(docker run --rm "${TASK51_RELEASE_IMAGE}" apache2ctl -S 2>&1)
          grep -Eq 'default server api\.xrteeth\.com' <<< "${vhost_dump}"
          grep -Eq 'alias api\.xrugc\.com' <<< "${vhost_dump}"

          smoke_dir=$(mktemp -d)
          container_id=''
          cleanup_task51_smoke() {
            if [ -n "${container_id}" ]; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
            fi
            rm -rf "${smoke_dir}"
          }
          trap cleanup_task51_smoke EXIT

          # First prove the pre-Yii debug guard fails closed without rendering
          # or logging a sensitive control-plane request. This intentionally
          # does not prove that the production application can bootstrap.
          http_sentinel=$(task51_random_base64url)
          test "${#http_sentinel}" = 43
          container_id=$(docker run -d \
            -p 127.0.0.1::80 \
            -e YII_DEBUG=1 \
            -e YII_ENV=dev \
            -e TASK51_STAGE_B_COORDINATOR_ENABLED=1 \
            -e TASK51_STAGE_B_INTERNAL_TOKEN="${http_sentinel}" \
            "${TASK51_RELEASE_IMAGE}")
          host_port=$(docker inspect \
            --format='{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' \
            "${container_id}")

          task51_wait_for_apache "${container_id}" "${host_port}" 'debug-guard'
          status='000'
          debug_curl_exit=0
          if status=$(curl --silent --show-error \
            --max-time 2 \
            --output "${smoke_dir}/debug-body" \
            --dump-header "${smoke_dir}/debug-headers" \
            --write-out '%{http_code}' \
            --header 'Host: api.xrteeth.com' \
            --header "X-Task51-Internal-Token: ${http_sentinel}" \
            --header 'Content-Type: application/json' \
            --data "{\"probe\":\"${http_sentinel}\"}" \
            "http://127.0.0.1:${host_port}/v1/task51/stage-b/issue" \
            2>"${smoke_dir}/debug-curl-error"); then
            :
          else
            debug_curl_exit=$?
          fi
          if [ "${debug_curl_exit}" -ne 0 ] || [ "${status}" != '404' ]; then
            echo "Release debug-guard HTTP assertion failed (curl=${debug_curl_exit}, status=${status:-000})." >&2
            exit 1
          fi
          test "${status}" = '404'
          grep -Eiq '^cache-control:[[:space:]]*no-store, private, max-age=0\r?$' \
            "${smoke_dir}/debug-headers"
          # The pre-Yii debug guard exits without rendering an application error
          # document. A non-empty body would mean the request reached Yii.
          test ! -s "${smoke_dir}/debug-body"
          if grep -Fq -- "${http_sentinel}" \
            "${smoke_dir}/debug-headers" "${smoke_dir}/debug-body"; then
            echo 'Release HTTP response exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi
          if ! task51_assert_container_files_clean "${container_id}" "${http_sentinel}"; then
            echo 'Release container files exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi
          docker stop --time 5 "${container_id}" >/dev/null
          docker logs "${container_id}" > "${smoke_dir}/debug-container.log" 2>&1
          if grep -Fq -- "${http_sentinel}" "${smoke_dir}/debug-container.log"; then
            echo 'Release container logs exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi
          docker rm "${container_id}" >/dev/null
          container_id=''

          # Now prove the exact release image really boots vendor/Yii and the
          # copied production common/API configs while the coordinator remains
          # default-off. Task51StageBSettings short-circuits before any DB or
          # Redis access, so deliberately unreachable endpoints make accidental
          # dependency access fail instead of turning this into an external-
          # service smoke.
          prod_http_sentinel=$(task51_random_base64url)
          test "${#prod_http_sentinel}" = 43
          container_id=$(docker run -d \
            -p 127.0.0.1::80 \
            -e YII_DEBUG=0 \
            -e YII_ENV=prod \
            -e TASK51_STAGE_B_COORDINATOR_ENABLED=0 \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_DB=task51_ci_must_not_connect \
            -e MYSQL_USERNAME=task51_ci_must_not_connect \
            -e MYSQL_PASSWORD=task51_ci_must_not_connect \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=1 \
            -e REDIS_DB=0 \
            "${TASK51_RELEASE_IMAGE}")
          host_port=$(docker inspect \
            --format='{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' \
            "${container_id}")

          task51_wait_for_apache "${container_id}" "${host_port}" 'production'
          status='000'
          prod_curl_exit=0
          if status=$(curl --silent --show-error \
            --max-time 2 \
            --output "${smoke_dir}/prod-body" \
            --dump-header "${smoke_dir}/prod-headers" \
            --write-out '%{http_code}' \
            --header 'Host: api.xrteeth.com' \
            --header 'Content-Type: application/json' \
            --data "{\"probe\":\"${prod_http_sentinel}\"}" \
            "http://127.0.0.1:${host_port}/v1/task51/stage-b/claim" \
            2>"${smoke_dir}/prod-curl-error"); then
            :
          else
            prod_curl_exit=$?
          fi
          if [ "${prod_curl_exit}" -ne 0 ] || [ "${status}" != '404' ]; then
            echo "Release production HTTP assertion failed (curl=${prod_curl_exit}, status=${status:-000})." >&2
            exit 1
          fi
          test -s "${smoke_dir}/prod-body"
          php -r '
            $body = json_decode(
              file_get_contents($argv[1]),
              true,
              8,
              JSON_THROW_ON_ERROR
            );
            if (!is_array($body) || ($body["status"] ?? null) !== 404) {
              fwrite(STDERR, "Production Yii smoke did not return its JSON 404.\n");
              exit(1);
            }
          ' "${smoke_dir}/prod-body"
          grep -Eiq '^content-type:[[:space:]]*application/json([;][[:space:]]*charset=UTF-8)?\r?$' \
            "${smoke_dir}/prod-headers"
          grep -Eiq '^cache-control:[[:space:]]*no-store, private, max-age=0\r?$' \
            "${smoke_dir}/prod-headers"
          grep -Eiq '^pragma:[[:space:]]*no-cache\r?$' "${smoke_dir}/prod-headers"
          grep -Eiq '^expires:[[:space:]]*0\r?$' "${smoke_dir}/prod-headers"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff\r?$' \
            "${smoke_dir}/prod-headers"
          if grep -Fq -- "${prod_http_sentinel}" \
            "${smoke_dir}/prod-headers" "${smoke_dir}/prod-body"; then
            echo 'Production Yii HTTP response exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi

          head -c 16385 /dev/zero | tr '\0' 'x' > "${smoke_dir}/oversize-body"
          for oversize_path in \
            '/v1/task51/stage-b/claim' \
            '/index.php/v1/task51/stage-b/claim'; do
            oversize_status='000'
            oversize_curl_exit=0
            if oversize_status=$(curl --silent --show-error \
              --max-time 2 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Host: api.xrteeth.com' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${smoke_dir}/oversize-body" \
              "http://127.0.0.1:${host_port}${oversize_path}" \
              2>"${smoke_dir}/oversize-curl-error"); then
              :
            else
              oversize_curl_exit=$?
            fi
            oversize_status=${oversize_status:-000}
            if [ "${oversize_status}" != '413' ]; then
              echo "Release oversize-body assertion failed for ${oversize_path} (curl=${oversize_curl_exit}, status=${oversize_status})." >&2
              exit 1
            fi
            test "${oversize_status}" = '413'
            # Apache may close a rejected upload after emitting the complete
            # HTTP 413 response. curl reports that expected close as exit 56;
            # the exact status remains mandatory, so the security gate is not
            # weakened into accepting a transport-only failure.
            if [ "${oversize_curl_exit}" -ne 0 ] \
              && [ "${oversize_curl_exit}" -ne 56 ]; then
              echo "Release oversize-body transport failed unexpectedly for ${oversize_path} (curl=${oversize_curl_exit})." >&2
              exit 1
            fi
          done

          if ! task51_assert_container_files_clean "${container_id}" "${prod_http_sentinel}"; then
            echo 'Production Yii container files exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi
          docker stop --time 5 "${container_id}" >/dev/null
          docker logs "${container_id}" > "${smoke_dir}/prod-container.log" 2>&1
          if grep -Fq -- "${prod_http_sentinel}" "${smoke_dir}/prod-container.log"; then
            echo 'Production Yii container logs exposed the Task 5.1 sentinel.' >&2
            exit 1
          fi

      - name: Push Docker Image
        run: |
          set -euo pipefail
          expected_commit=$(tr -d '\r\n' < advanced/GIT_COMMIT)
          remote_head=$(git ls-remote --exit-code origin "${GITHUB_REF}" | awk '{print $1}')
          test "${remote_head}" = "${expected_commit}"

          # Publish the immutable identity first. Mutable deployment tags are
          # allowed to move only while this run is still the exact branch head.
          docker push "${TASK51_RELEASE_IMMUTABLE_IMAGE}"
          docker push "${TASK51_RELEASE_IMAGE}"

          # Push latest tag（仅 publish 分支）
          if [ "${{ github.ref }}" = "refs/heads/publish" ]; then
            docker tag "${TASK51_RELEASE_IMAGE}" hkccr.ccs.tencentyun.com/gdgeek/api:latest
            docker push hkccr.ccs.tencentyun.com/gdgeek/api:latest
          fi

          remote_head_after_push=$(git ls-remote --exit-code origin "${GITHUB_REF}" | awk '{print $1}')
          test "${remote_head_after_push}" = "${expected_commit}"

          # Resolve every tag from the registry, not from the local build cache.
          # Equal raw-manifest hashes prove branch/latest point at this run's
          # immutable image. A fresh pull then proves its OCI revision label.
          immutable_manifest_sha=$(docker buildx imagetools inspect --raw \
            "${TASK51_RELEASE_IMMUTABLE_IMAGE}" | sha256sum | awk '{print $1}')
          branch_manifest_sha=$(docker buildx imagetools inspect --raw \
            "${TASK51_RELEASE_IMAGE}" | sha256sum | awk '{print $1}')
          test "${branch_manifest_sha}" = "${immutable_manifest_sha}"

          local_image_refs=("${TASK51_RELEASE_IMAGE}" "${TASK51_RELEASE_IMMUTABLE_IMAGE}")
          if [ "${{ github.ref }}" = "refs/heads/publish" ]; then
            latest_manifest_sha=$(docker buildx imagetools inspect --raw \
              hkccr.ccs.tencentyun.com/gdgeek/api:latest | sha256sum | awk '{print $1}')
            test "${latest_manifest_sha}" = "${immutable_manifest_sha}"
            local_image_refs+=(hkccr.ccs.tencentyun.com/gdgeek/api:latest)
          fi

          docker image rm "${local_image_refs[@]}" >/dev/null
          docker pull "${TASK51_RELEASE_IMMUTABLE_IMAGE}" >/dev/null
          remote_oci_revision=$(docker image inspect \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${TASK51_RELEASE_IMMUTABLE_IMAGE}")
          test "${remote_oci_revision}" = "${expected_commit}"

  # 阶段3: registry publish notice（仅 publish 分支）。这不是部署证明；
  # Task 5.1 必须另外取得 live consumer digest/revision/health convergence。
  publish_notice:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    steps:
      - name: Record External Deployment Boundary
        run: >-
          echo "publish/latest images pushed; deployment is external and remains
          unverified until consumer digest, OCI revision, and health converge"
