<VirtualHost *:80>
    ServerAdmin nethz@163.com
    
    ServerName api.localhost.com   
    DocumentRoot /var/www/html/advanced/api/web

    # Pass Docker environment variables to PHP
    PassEnv JWT_KEY
    PassEnv YII_DEBUG YII_ENV
    PassEnv MYSQL_HOST MYSQL_DB MYSQL_USERNAME MYSQL_PASSWORD
    PassEnv REDIS_HOST REDIS_PORT REDIS_DB
    # Login-code v1 settings are read by PHP through getenv(). Keep this list
    # in sync with driver/docker-compose.yml so Apache request workers do not
    # silently fall back to database/database while Yii3 uses Redis modes.
    PassEnv LOGIN_CODE_READ_MODE LOGIN_CODE_WRITE_MODE LOGIN_CODE_REDIS_PREFIX LOGIN_CODE_PROTOCOL_FINGERPRINT
    PassEnv LOGIN_CODE_ACTIVE_WINDOW_SECONDS LOGIN_CODE_RECORD_TTL_SECONDS
    PassEnv LOGIN_CODE_ISSUE_LIMIT LOGIN_CODE_ISSUE_WINDOW_SECONDS LOGIN_CODE_LEGACY_DB_AVAILABLE
    # Task 5.1 remains default-off in PHP; these names must be visible to the
    # request worker only when a separately approved Stage B window enables it.
    PassEnv TASK51_STAGE_B_COORDINATOR_ENABLED TASK51_STAGE_B_COORDINATOR_PUBLIC_ORIGIN
    PassEnv TASK51_STAGE_B_COORDINATOR_SERVER_PUBLISH_SHA TASK51_STAGE_B_INTERNAL_TOKEN
    PassEnv SECRET_ID SECRET_KEY
    PassEnv COS_BUCKETS_PUBLIC_BUCKET COS_BUCKETS_PUBLIC_REGION
    PassEnv COS_BUCKETS_PRIVATE_BUCKET COS_BUCKETS_PRIVATE_REGION
    PassEnv DEPLOYMENT_MODE FILE_STORAGE_DRIVER
    PassEnv LOCAL_STORAGE_ROOT LOCAL_STORAGE_PUBLIC_BASE_URL
    PassEnv LOCAL_STORAGE_PUBLIC_BUCKET LOCAL_STORAGE_PRIVATE_BUCKET LOCAL_STORAGE_TEMP_BUCKET
    PassEnv ENABLE_COS_STORAGE ENABLE_COS_IMAGE_PROCESSING ENABLE_AI_3D_GENERATOR
    PassEnv ENABLE_WECHAT_LOGIN ENABLE_APPLE_LOGIN ENABLE_GEO_IP_LOCALE ENABLE_ANALYTICS ENABLE_EXTERNAL_CDN
    PassEnv MAILER_USERNAME MAILER_PASSWORD

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory "/var/www/html/advanced/api/web">
        # Disable .htaccess
        AllowOverride None
    </Directory>

    <LocationMatch "^/(index\.php/)?v1/task51/stage-b/(issue|claim|consume)$">
        LimitRequestBody 16384
    </LocationMatch>

    <Directory "/var/www/html/advanced/api/web/storage">
        # Enable .htaccess
        AllowOverride All
    </Directory>

  
    # Set up rewrites so that all requests go to index.php
    RewriteEngine on
    # if a directory or a file exists, use it directly
    RewriteCond /var/www/html/advanced/api/web%{REQUEST_FILENAME} !-f
    RewriteCond /var/www/html/advanced/api/web%{REQUEST_FILENAME} !-d
    # otherwise forward it to index.php
    RewriteRule . /var/www/html/advanced/api/web/index.php

    

</VirtualHost>
